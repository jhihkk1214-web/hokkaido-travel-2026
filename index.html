          case 'shopping': return { bg: 'bg-rose-100 text-rose-800 border-rose-200', Icon: ShoppingIcon, label: '購物' };
          case 'car': return { bg: 'bg-blue-100 text-blue-800 border-blue-200', Icon: CarIcon, label: '租車/自駕' };
          case 'train': return { bg: 'bg-purple-100 text-purple-800 border-purple-200', Icon: TrainIcon, label: '鐵道/JR' };
          case 'airport': return { bg: 'bg-cyan-100 text-cyan-800 border-cyan-200', Icon: PlaneIcon, label: '航班/機場' };
          default: return { bg: 'bg-gray-100 text-gray-800 border-gray-200', Icon: CameraIcon, label: '地點' };
        }
      };

      const getGoogleMapsUrl = (spotName) => {
        return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(spotName)}`;
      };

      const getDirectionUrl = (origin, destination, transitType) => {
        let mode = 'driving';
        if (transitType === 'foot') mode = 'walking';
        if (transitType === 'bus' || transitType === 'train') mode = 'transit';
        return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}&travelmode=${mode}`;
      };

      const handleSaveWeather = (dayNum, newWeather) => {
        const updated = schedule.map(dayObj => {
          if (dayObj.day === dayNum) {
            return {
              ...dayObj,
              weather: {
                ...dayObj.weather,
                ...newWeather
              }
            };
          }
          return dayObj;
        });
        setSchedule(updated);
        setEditingWeatherDay(null);
      };

      return (
        <div className="min-h-screen bg-stone-100 text-stone-800 pb-20 font-sans">
          {}
          <header className="bg-emerald-900 text-stone-100 shadow-md">
            <div className="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
              <div>
                <div className="flex items-center space-x-2">
                  <SparklesIcon className="w-4 h-4 text-amber-400" />
                  <span className="text-xs font-semibold tracking-wider text-emerald-200">2026/10/18 ~ 10/25</span>
                </div>
                <h1 className="text-lg md:text-xl font-bold tracking-tight text-white mt-0.5">
                  北海道 8 日自駕 + 鐵道美食手札 🍁
                </h1>
              </div>
              <button 
                onClick={resetScheduleToDefault}
                className="text-xs bg-emerald-800 hover:bg-emerald-700 text-emerald-100 px-3 py-2 rounded-xl border border-emerald-700 font-medium transition"
              >
                重設最新資料
              </button>
            </div>
          </header>

          <div className="bg-emerald-800/90 text-emerald-100 border-b border-emerald-700 text-xs py-2 px-4 shadow-inner">
            <div className="max-w-3xl mx-auto flex items-center justify-between overflow-x-auto whitespace-nowrap gap-4">
              <div className="flex items-center space-x-1">
                <HotelIcon className="w-3.5 h-3.5 text-amber-300 flex-shrink-0" />
                <span className="font-semibold">入住飯店：</span>
              </div>
              <div className="flex space-x-3 text-emerald-200 text-xs">
                <span>10/18-21: <strong className="text-white">Vessel Inn 中島公園</strong></span>
                <span>•</span>
                <span>10/21-22: <strong className="text-white">乃之風渡假酒店</strong></span>
                <span>•</span>
                <span>10/22-25: <strong className="text-white">Sapporo View Hotel</strong></span>
              </div>
            </div>
          </div>

          {}
          <div className="sticky top-0 z-30 bg-stone-100/95 backdrop-blur border-b border-stone-200 shadow-sm">
            <div className="max-w-3xl mx-auto px-2 flex overflow-x-auto py-2.5 no-scrollbar gap-1.5">
              {schedule.map((d) => (
                <button
                  key={d.day}
                  onClick={() => setActiveDay(d.day)}
                  className={`flex-shrink-0 px-3.5 py-1.5 rounded-full text-xs font-medium transition-all duration-200 flex flex-col items-center min-w-[68px] ${
                    d.day === activeDay
                      ? 'bg-amber-600 text-white shadow-md scale-105 font-bold'
                      : 'bg-white text-stone-600 hover:bg-stone-200 border border-stone-200'
                  }`}
                >
                  <span className="text-[10px] opacity-80">Day {d.day}</span>
                  <span>{d.date.split(' ')[0].substring(5)}</span>
                </button>
              ))}
            </div>
          </div>

          {}
          <main className="max-w-3xl mx-auto px-4 pt-4">
            <div className="bg-white rounded-2xl p-4 shadow-sm border border-stone-200/80 mb-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div>
                <div className="flex items-center space-x-2 text-amber-700 text-xs font-bold">
                  <ClockIcon className="w-3.5 h-3.5" />
                  <span>Day {currentDayData.day} ‧ {currentDayData.date}</span>
                </div>
                <h2 className="text-lg font-bold text-stone-900 mt-0.5">{currentDayData.title}</h2>
              </div>
              <div className="flex items-center space-x-1.5 bg-amber-50 border border-amber-200 px-3 py-1.5 rounded-xl text-xs text-amber-900 self-start sm:self-auto">
                <HotelIcon className="w-3.5 h-3.5 text-amber-600" />
                <span>今晚住宿：<strong className="text-stone-900">{currentDayData.hotel}</strong></span>
              </div>
            </div>

            {/* tenki.jp Weather Box */}
            {currentDayData.weather && (
              <div className="bg-gradient-to-r from-sky-50 to-blue-50 border border-sky-200 rounded-2xl p-3.5 mb-4 shadow-xs">
                <div className="flex items-center justify-between flex-wrap gap-2">
                  <div className="flex items-center space-x-2">
                    <span className="text-xs bg-blue-600 text-white font-bold px-2 py-0.5 rounded-md flex items-center">
                      tenki.jp 氣候觀測
                    </span>
                    <span className="text-xs font-bold text-sky-900">{currentDayData.weather.condition}</span>
                  </div>
                  
                  <div className="flex items-center space-x-2">
                    <div className="text-xs text-sky-800 font-semibold">
                      <span>高溫 {currentDayData.weather.tempHigh} / 低溫 {currentDayData.weather.tempLow}</span>
                      <span className="ml-2 text-blue-700 bg-sky-100 px-1.5 py-0.5 rounded-full font-bold">降雨 {currentDayData.weather.rainProb}</span>
                    </div>

                    <a 
                      href={currentDayData.weather.tenkiUrl} 
                      target="_blank" 
                      rel="noreferrer"
                      className="text-[11px] text-blue-600 hover:text-blue-800 underline font-medium flex items-center bg-white px-2 py-0.5 rounded-lg border border-sky-200 shadow-2xs"
                    >
                      <span>tenki.jp 觀測</span>
                      <ExternalLinkIcon className="w-3 h-3 ml-0.5" />
                    </a>

                    <button 
                      onClick={() => setEditingWeatherDay(currentDayData)}
                      className="text-[11px] text-amber-700 hover:text-amber-900 font-medium flex items-center bg-amber-100/80 hover:bg-amber-100 px-2 py-0.5 rounded-lg border border-amber-200 transition"
                    >
                      <EditIcon className="w-3 h-3 mr-0.5" />
                      <span>修改預報</span>
                    </button>
                  </div>
                </div>

                <p className="text-xs text-sky-900/90 mt-2 leading-relaxed border-t border-sky-200/60 pt-1.5">
                  <strong>穿著與氣候提醒：</strong>{currentDayData.weather.note}
                </p>
              </div>
            )}

            {}
            <div className="space-y-4">
              {currentDayData.spots.map((spot, idx, array) => {
                const badge = getCategoryBadge(spot.category);
                const BadgeIcon = badge.Icon;
                const nextSpot = array[idx + 1];

                return (
                  <React.Fragment key={spot.id}>
                    <div className="bg-white rounded-2xl overflow-hidden shadow-sm border border-stone-200/80 hover:shadow-md transition">
                      <div className="p-4">
                        <div className="flex items-start justify-between gap-3">
                          <div className="flex items-start space-x-3">
                            <div className="w-8 h-8 rounded-full bg-emerald-800 text-white flex items-center justify-center font-bold text-xs flex-shrink-0 shadow-sm border-2 border-white mt-0.5">
                              {idx + 1}
                            </div>
                            <div>
                              <div className="flex items-center space-x-2 flex-wrap gap-y-1">
                                <span className={`text-[10px] px-2 py-0.5 rounded-full font-medium flex items-center border ${badge.bg}`}>
                                  <BadgeIcon className="w-2.5 h-2.5 mr-1" />
                                  {badge.label}
                                </span>
                                <span className="text-xs font-bold text-amber-700 flex items-center">
                                  <ClockIcon className="w-3 h-3 mr-1 inline" />
                                  行程規劃：{spot.time}
                                </span>
                                {spot.stay && spot.stay !== "00:00" && (
                                  <span className="text-[10px] text-stone-500 bg-stone-100 px-1.5 py-0.5 rounded-full font-medium">
                                    停留 {spot.stay}
                                  </span>
                                )}
                              </div>
                              <h3 className="text-base font-bold text-stone-900 mt-1">{spot.name}</h3>
                              {spot.hours && (
                                <div className="mt-1 text-xs text-amber-900 font-medium">
                                  <strong>營業/服務時間：</strong>{spot.hours}
                                </div>
                              )}
                            </div>
                          </div>

                          <a
                            href={getGoogleMapsUrl(spot.name)}
                            target="_blank"
                            rel="noreferrer"
                            className="flex items-center space-x-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-2 rounded-xl font-medium shadow-sm flex-shrink-0 transition"
                          >
                            <NavIcon className="w-3.5 h-3.5" />
                            <span>導航</span>
                          </a>
                        </div>

                        {spot.desc && (
                          <div className="mt-3 p-3 bg-stone-50 rounded-xl border border-stone-200/80 text-xs text-stone-800 leading-relaxed">
                            <p>{spot.desc}</p>
                          </div>
                        )}

                        {spot.notes && (
                          <div className="mt-2 text-xs bg-amber-50/80 text-amber-950 border border-amber-200/80 p-2.5 rounded-xl">
                            <p className="leading-relaxed">
                              <strong>備註與提醒：</strong>{spot.notes}
                            </p>
                          </div>
                        )}
                      </div>
                    </div>

                    {spot.transit && nextSpot && (
                      <div className="my-2 ml-10 flex items-center text-[11px] text-stone-500 space-x-2">
                        <div className="w-2 h-2 rounded-full bg-stone-300"></div>
                        <div className="flex-1 border-t border-dashed border-stone-300"></div>
                        <div className="bg-stone-200/90 px-2.5 py-1 rounded-full flex items-center space-x-1 font-medium text-stone-700">
                          <span>{spot.transit.duration}</span>
                        </div>
                        <a
                          href={getDirectionUrl(spot.name, nextSpot.name, spot.transit.type)}
                          target="_blank"
                          rel="noreferrer"
                          className="text-[10px] text-blue-600 hover:underline flex items-center font-medium"
                        >
                          路線導航 ➔
                        </a>
                        <div className="flex-1 border-t border-dashed border-stone-300"></div>
                      </div>
                    )}
                  </React.Fragment>
                );
              })}
            </div>
          </main>

          {}
          {editingWeatherDay && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-5 shadow-xl">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="text-base font-bold text-stone-900">
                    更新 Day {editingWeatherDay.day} 天氣數據 (tenki.jp)
                  </h3>
                  <a 
                    href={editingWeatherDay.weather.tenkiUrl} 
                    target="_blank" 
                    rel="noreferrer"
                    className="text-xs text-blue-600 hover:underline font-medium flex items-center"
                  >
                    開啟 tenki.jp 頁面 ↗
                  </a>
                </div>

                <label className="block text-xs font-bold text-stone-700 mb-1">天氣狀況 (例: 晴時多雲 ☀️⛅):</label>
                <input
                  type="text"
                  defaultValue={editingWeatherDay.weather.condition}
                  id="weatherCondInput"
                  className="w-full text-xs p-2.5 border border-stone-300 rounded-xl mb-3 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                />

                <div className="grid grid-cols-3 gap-2 mb-3">
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">最高溫 (°C):</label>
                    <input
                      type="text"
                      defaultValue={editingWeatherDay.weather.tempHigh}
                      id="weatherHighInput"
                      className="w-full text-xs p-2 border border-stone-300 rounded-xl focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">最低溫 (°C):</label>
                    <input
                      type="text"
                      defaultValue={editingWeatherDay.weather.tempLow}
                      id="weatherLowInput"
                      className="w-full text-xs p-2 border border-stone-300 rounded-xl focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">降雨機率 (%):</label>
                    <input
                      type="text"
                      defaultValue={editingWeatherDay.weather.rainProb}
                      id="weatherRainInput"
                      className="w-full text-xs p-2 border border-stone-300 rounded-xl focus:outline-none"
                    />
                  </div>
                </div>

                <label className="block text-xs font-bold text-stone-700 mb-1">穿著與天氣提醒說明:</label>
                <textarea
                  defaultValue={editingWeatherDay.weather.note}
                  id="weatherNoteInput"
                  rows={3}
                  className="w-full text-xs p-2.5 border border-stone-300 rounded-xl focus:outline-none mb-4"
                />

                <div className="flex justify-end space-x-2">
                  <button
                    onClick={() => setEditingWeatherDay(null)}
                    className="px-3 py-1.5 text-xs text-stone-600 hover:bg-stone-100 rounded-lg"
                  >
                    取消
                  </button>
                  <button
                    onClick={() => {
                      const condition = document.getElementById('weatherCondInput').value;
                      const tempHigh = document.getElementById('weatherHighInput').value;
                      const tempLow = document.getElementById('weatherLowInput').value;
                      const rainProb = document.getElementById('weatherRainInput').value;
                      const note = document.getElementById('weatherNoteInput').value;

                      handleSaveWeather(editingWeatherDay.day, {
                        condition,
                        tempHigh,
                        tempLow,
                        rainProb,
                        note
                      });
                    }}
                    className="px-4 py-1.5 text-xs bg-blue-600 text-white rounded-lg font-medium shadow-sm hover:bg-blue-700"
                  >
                    儲存更新數據
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
